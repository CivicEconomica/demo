<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerMap — Find opportunities that shape your future.</title>
<meta name="description" content="CareerMap connects students with work experience, internships, insight days, volunteering and other career opportunities.">
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{
 --blue-950:#08264a;--blue-900:#0b3568;--blue-800:#0b4f9c;--blue-700:#1265c4;--blue-600:#1976d2;
 --blue-500:#2f8df0;--blue-100:#e7f2ff;--blue-50:#f4f9ff;--ink:#12233a;--muted:#607089;
 --bg:#f5f8fc;--white:#fff;--border:#dce5f0;--success:#16845b;--warning:#b87900;--danger:#c43d4b;
 --shadow:0 12px 35px rgba(15,55,100,.08);--radius:18px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
a{text-decoration:none;color:inherit}.hidden{display:none!important}.container{width:min(1180px,calc(100% - 36px));margin:auto}
.nav{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-inner{height:72px;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:21px;color:var(--blue-900)}
.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,var(--blue-700),var(--blue-950));display:grid;place-items:center;color:white;box-shadow:0 7px 16px rgba(18,101,196,.24)}
.logo svg{width:23px}.nav-links{display:flex;align-items:center;gap:5px;flex:1}.nav-links a,.nav-links button{padding:10px 13px;border:0;background:none;color:#4d5d73;border-radius:10px}.nav-links a:hover,.nav-links button:hover{background:var(--blue-50);color:var(--blue-800)}
.nav-actions{display:flex;gap:9px;align-items:center}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--blue-700);color:#fff;box-shadow:0 7px 16px rgba(18,101,196,.2)}.btn-primary:hover{background:var(--blue-800)}.btn-secondary{background:var(--blue-100);color:var(--blue-800)}.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--ink)}.btn-danger{background:#fff0f1;color:var(--danger)}.btn-small{padding:8px 11px;font-size:13px}.menu{display:none;background:none;border:0;font-size:26px;color:var(--blue-900)}
.hero{padding:72px 0 64px;background:radial-gradient(circle at 80% 20%,#dceeff 0,transparent 34%),linear-gradient(180deg,#fff 0,#f6faff 100%);overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:55px;align-items:center}.eyebrow{display:inline-flex;gap:7px;align-items:center;background:var(--blue-100);color:var(--blue-800);font-weight:800;font-size:13px;padding:7px 11px;border-radius:99px}
h1{font-size:clamp(40px,5.5vw,67px);line-height:1.02;letter-spacing:-2.8px;margin:19px 0;color:var(--blue-950)}.hero p{font-size:18px;line-height:1.7;color:var(--muted);max-width:650px}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero-card{background:#fff;border:1px solid var(--border);border-radius:26px;padding:22px;box-shadow:var(--shadow);transform:rotate(1deg)}.mock-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.mock-map{height:255px;border-radius:17px;background:linear-gradient(145deg,#d9ebff,#eef7ff);position:relative;overflow:hidden}.mock-map:before,.mock-map:after{content:"";position:absolute;background:#fff;border-radius:40px;transform:rotate(-19deg);opacity:.9}.mock-map:before{width:145%;height:20px;top:45%;left:-20%}.mock-map:after{width:120%;height:14px;top:68%;left:-10%;transform:rotate(25deg)}.pin{position:absolute;width:35px;height:35px;border:5px solid white;border-radius:50% 50% 50% 0;background:var(--blue-700);transform:rotate(-45deg);box-shadow:0 6px 14px #1b5d9a55}.pin i{display:block;width:8px;height:8px;background:white;border-radius:50%;margin:9px}.p1{left:22%;top:25%}.p2{left:66%;top:49%}.p3{left:46%;top:70%}.mock-row{display:flex;gap:10px;margin-top:14px}.mini{height:10px;border-radius:10px;background:#dce7f3;flex:1}.section{padding:76px 0}.section-head{text-align:center;max-width:700px;margin:0 auto 35px}.section h2{font-size:34px;margin:0 0 10px;color:var(--blue-950);letter-spacing:-1px}.section-head p{color:var(--muted);line-height:1.65}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.feature,.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.feature{padding:23px}.icon{width:44px;height:44px;border-radius:13px;background:var(--blue-100);color:var(--blue-700);display:grid;place-items:center;margin-bottom:17px}.feature h3{margin:0 0 7px}.feature p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.step{padding:23px;background:#fff;border:1px solid var(--border);border-radius:18px}.num{width:31px;height:31px;border-radius:50%;background:var(--blue-700);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:15px}.step p{color:var(--muted);font-size:14px;line-height:1.5}
.employer-cta{background:linear-gradient(135deg,var(--blue-950),var(--blue-700));border-radius:26px;padding:45px;color:white;display:flex;justify-content:space-between;gap:30px;align-items:center}.employer-cta h2{margin:0 0 9px;font-size:32px}.employer-cta p{margin:0;color:#d9eaff;line-height:1.6}.employer-cta .btn{background:#fff;color:var(--blue-900)}
.page{padding:34px 0 70px}.page-title{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.page-title h1{font-size:38px;letter-spacing:-1.5px;margin:0}.page-title p{color:var(--muted);margin:7px 0 0}
.toolbar{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.input,.select,.textarea{border:1px solid var(--border);background:#fff;border-radius:11px;padding:11px 12px;outline:none;color:var(--ink);width:100%}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px #2f8df018}.search{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.opp-card{padding:20px;position:relative}.opp-top{display:flex;justify-content:space-between;gap:15px}.org{font-size:13px;color:var(--blue-700);font-weight:800}.opp-title{font-size:19px;font-weight:800;margin:5px 0 11px}.meta{display:flex;gap:7px;flex-wrap:wrap;color:#63738a;font-size:13px}.tag{background:var(--blue-50);color:var(--blue-800);padding:5px 8px;border-radius:8px;font-weight:650}.desc{color:var(--muted);line-height:1.55;font-size:14px;margin:13px 0}.skills{display:flex;gap:6px;flex-wrap:wrap}.skill{font-size:12px;padding:5px 8px;border-radius:7px;background:#f0f3f7;color:#526277}.card-actions{display:flex;gap:8px;margin-top:16px}.save{background:none;border:1px solid var(--border);border-radius:10px;padding:8px 11px;color:var(--blue-800);font-weight:750}.save.saved{background:#e8f3ff;border-color:#b9d8fb}.empty{text-align:center;padding:55px 20px;color:var(--muted);grid-column:1/-1}.count{color:var(--muted);font-size:14px;margin:8px 0 15px}.layout-map{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.mapbox{height:650px;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:#e9f3ff}.listbox{max-height:650px;overflow:auto;padding-right:3px}.listbox .opp-card{margin-bottom:12px}
.modal-wrap{position:fixed;inset:0;background:#071b3190;z-index:3000;display:grid;place-items:center;padding:18px}.modal{background:#fff;border-radius:20px;width:min(690px,100%);max-height:92vh;overflow:auto;padding:25px;box-shadow:0 30px 80px #071b3155}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0}.close{border:0;background:#eef3f8;border-radius:9px;width:36px;height:36px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.label{font-size:13px;font-weight:750;color:#3f5067}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.auth{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:40px 0}.auth-card{width:min(480px,100%);background:#fff;border:1px solid var(--border);border-radius:22px;padding:30px;box-shadow:var(--shadow)}.auth-card h1{font-size:35px;letter-spacing:-1.2px;margin:0 0 8px}.auth-card>p{color:var(--muted);margin-top:0}.role-toggle{display:grid;grid-template-columns:1fr 1fr;background:#eef4fa;border-radius:11px;padding:4px;margin:20px 0}.role-toggle button{border:0;background:transparent;padding:10px;border-radius:8px;font-weight:750;color:var(--muted)}.role-toggle button.active{background:#fff;color:var(--blue-800);box-shadow:0 3px 9px #183d5a10}.auth-form{display:grid;gap:13px}.notice{padding:11px 13px;border-radius:10px;font-size:13px}.notice.error{background:#fff0f1;color:#a52f3d}.notice.success{background:#e9f8f1;color:#126f4d}
.dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.stat{padding:20px}.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-size:31px;font-weight:850;color:var(--blue-900);margin-top:5px}.dash-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:17px}.panel{padding:21px}.panel h2{margin:0 0 17px;font-size:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf1f5;font-size:13px}.table th{color:var(--muted);font-weight:700}.status{display:inline-flex;padding:5px 8px;border-radius:8px;font-size:12px;font-weight:750;background:#eef3f8;color:#53657a}.status.accepted{background:#e6f7ef;color:#15734f}.status.rejected{background:#fff0f1;color:#ad3542}.status.review{background:#fff6dd;color:#956500}.profile-card{padding:25px}.profile-head{display:flex;gap:16px;align-items:center;margin-bottom:23px}.avatar{width:62px;height:62px;border-radius:18px;background:var(--blue-700);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:850}.muted{color:var(--muted)}.detail{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px}.detail h1{font-size:42px;margin:8px 0 13px}.detail-grid{display:grid;grid-template-columns:1fr 330px;gap:22px}.side{padding:20px;position:sticky;top:90px;height:max-content}.side .btn{width:100%;margin-top:8px}.notification{padding:13px;border:1px solid var(--border);border-radius:12px;margin-bottom:9px}.notification.unread{background:var(--blue-50);border-color:#cde3fb}.footer{background:var(--blue-950);color:#c7dbf1;padding:40px 0;margin-top:40px}.footer-inner{display:flex;justify-content:space-between;gap:20px}.footer strong{color:white}.toast{position:fixed;right:20px;bottom:20px;background:var(--blue-950);color:white;padding:13px 16px;border-radius:12px;box-shadow:0 15px 35px #071b3155;z-index:5000;animation:up .2s ease}.toast.success{background:var(--success)}.toast.error{background:var(--danger)}@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:900px){.hero-grid,.detail-grid,.layout-map,.dash-layout{grid-template-columns:1fr}.features,.steps{grid-template-columns:1fr 1fr}.dashboard-grid{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.side{position:static}.nav-links{display:none}.nav-actions{margin-left:auto}.menu{display:block}.nav.mobile-open .nav-links{display:flex;position:absolute;top:72px;left:0;right:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 18px;flex-direction:column;align-items:stretch}.nav.mobile-open .nav-actions{display:none}}
@media(max-width:560px){.container{width:min(100% - 24px,1180px)}.hero{padding:48px 0}.features,.steps,.dashboard-grid{grid-template-columns:1fr}h1{letter-spacing:-1.8px}.hero-actions,.card-actions{flex-direction:column}.btn{width:100%}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-title{align-items:flex-start;flex-direction:column}.detail h1{font-size:32px}.footer-inner{flex-direction:column}.toolbar>*{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const KEY="careermap_state_v1";
const seed={
 users:[],
 currentUserId:null,
 opportunities:[
  {id:"o1",title:"Software Engineering Work Experience",organisation:"Microsoft",location:"Reading",type:"Work Experience",duration:"1 week",description:"A practical introduction to software engineering through workshops, team challenges and career insight.",skills:["JavaScript","Teamwork","Problem Solving"],access:"Year 12, Year 13, 16+",lat:51.4543,lng:-0.9781,deadline:"2026-10-18",remote:"Hybrid",paid:"Unpaid",spaces:30,status:"Published",createdAt:"2026-08-01",employerId:null},
  {id:"o2",title:"Marketing Internship",organisation:"Adobe",location:"London",type:"Internship",duration:"2 weeks",description:"Explore creative marketing, campaigns and digital storytelling alongside an experienced team.",skills:["Marketing","Communication","Creativity"],access:"Year 13, 18+",lat:51.5074,lng:-0.1278,deadline:"2026-09-28",remote:"In-person",paid:"Paid",spaces:8,status:"Published",createdAt:"2026-08-05",employerId:null},
  {id:"o3",title:"Finance Insight Day",organisation:"HSBC",location:"Birmingham",type:"Insight Day",duration:"1 day",description:"Meet professionals, learn about financial careers and take part in interactive sessions.",skills:["Finance","Numeracy","Teamwork"],access:"Year 12, Year 13, 16+",lat:52.4862,lng:-1.8904,deadline:"2026-09-15",remote:"In-person",paid:"Unpaid",spaces:50,status:"Published",createdAt:"2026-08-04",employerId:null},
  {id:"o4",title:"Legal Work Experience",organisation:"Freshfields",location:"London",type:"Work Experience",duration:"3 days",description:"Get an introduction to commercial law through workshops, case studies and networking.",skills:["Law","Research","Communication"],access:"Year 12, Year 13, 16+",lat:51.5147,lng:-0.0803,deadline:"2026-10-01",remote:"In-person",paid:"Unpaid",spaces:15,status:"Published",createdAt:"2026-07-30",employerId:null},
  {id:"o5",title:"Media and Journalism Shadowing",organisation:"BBC",location:"Reading",type:"Shadowing",duration:"2 days",description:"Shadow media professionals and learn how stories move from idea to broadcast.",skills:["Writing","Media","Communication"],access:"16+, Open to all students",lat:51.4543,lng:-0.9738,deadline:"2026-09-22",remote:"Hybrid",paid:"Unpaid",spaces:10,status:"Published",createdAt:"2026-08-07",employerId:null},
  {id:"o6",title:"Community Volunteering Programme",organisation:"British Red Cross",location:"Bracknell",type:"Volunteering",duration:"Flexible",description:"Build transferable skills while supporting community projects and local services.",skills:["Teamwork","Leadership","Empathy"],access:"Open to all students",lat:51.4138,lng:-0.7505,deadline:"2026-12-31",remote:"In-person",paid:"Unpaid",spaces:40,status:"Published",createdAt:"2026-07-25",employerId:null}
 ],
 saves:[], applications:[], notifications:[]
};
let state=load();
let route=location.hash.slice(1)||"/";
function load(){try{return {...seed,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return seed}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function uid(prefix="id"){return prefix+Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function user(){return state.users.find(u=>u.id===state.currentUserId)||null}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function initials(n){return (n||"U").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function toast(msg,type=""){const d=document.createElement("div");d.className="toast "+type;d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function go(r){location.hash=r; route=r; render()}
window.addEventListener("hashchange",()=>{route=location.hash.slice(1)||"/";render()});
function nav(){
 const u=user(); const dash=u?(u.role==="employer"?"/employer/dashboard":"/dashboard"):"/login";
 return `<header class="nav" id="nav"><div class="container nav-inner">
  <a class="brand" href="#/"><span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18V8l8-4 8 4v10l-8 3-8-3Z" stroke="currentColor" stroke-width="2"/><path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>CareerMap</a>
  <button class="menu" onclick="document.getElementById('nav').classList.toggle('mobile-open')" aria-label="Open menu">☰</button>
  <nav class="nav-links"><a href="#/">Home</a><a href="#/opportunities">Opportunities</a>${u?`<a href="#${dash}">${u.role==="employer"?"Employer Dashboard":"Dashboard"}</a>`:""}</nav>
  <div class="nav-actions">${u?`<a class="btn btn-ghost btn-small" href="#${u.role==="employer"?"/employer/profile":"/profile"}">${u.role==="employer"?"Organisation":"Profile"}</a><button class="btn btn-primary btn-small" onclick="logout()">Log out</button>`:`<a class="btn btn-ghost btn-small" href="#/login">Log in</a><a class="btn btn-primary btn-small" href="#/register">Get started</a>`}</div>
 </div></header>`
}
function shell(content){document.getElementById("app").innerHTML=nav()+content+footer()}
function footer(){return `<footer class="footer"><div class="container footer-inner"><div><strong>CareerMap</strong><div style="margin-top:7px">Find opportunities that shape your future.</div></div><div>Built for students, schools, employers and organisations.</div></div></footer>`}
function home(){shell(`<main>
<section class="hero"><div class="container hero-grid"><div><span class="eyebrow">✦ Opportunities made easier</span><h1>Find opportunities that shape your future.</h1><p>Discover work experience, internships, insight days, volunteering and career opportunities — all in one place.</p><div class="hero-actions"><a class="btn btn-primary" href="#/opportunities">Explore opportunities</a><a class="btn btn-ghost" href="#/register">Create an account</a></div></div>
<div class="hero-card"><div class="mock-top"><strong>Opportunities near you</strong><span class="tag">6 found</span></div><div class="mock-map"><span class="pin p1"><i></i></span><span class="pin p2"><i></i></span><span class="pin p3"><i></i></span></div><div class="mock-row"><div class="mini"></div><div class="mini"></div><div class="mini"></div></div></div></div></section>
<section class="section"><div class="container"><div class="section-head"><h2>Everything you need to get started</h2><p>CareerMap brings discovery, applications and career planning together in one simple experience.</p></div><div class="features">
${feature("⌖","Find opportunities","Search across work experience, internships, apprenticeships, volunteering and more.")}
${feature("◉","Discover what's near you","Use the interactive map and your location to find opportunities nearby.")}
${feature("♡","Save your favourites","Keep promising opportunities in one place and come back when you're ready.")}
${feature("↗","Build your career","Create a profile, apply confidently and track every application.")}
</div></div></section>
<section class="section" style="padding-top:20px"><div class="container"><div class="section-head"><h2>How CareerMap works</h2><p>Four simple steps from discovery to experience.</p></div><div class="steps">${["Create your profile","Discover opportunities","Save or apply","Build experience"].map((x,i)=>`<div class="step"><div class="num">${i+1}</div><h3>${x}</h3><p>${["Tell us about your subjects, interests and location.","Search, filter and explore opportunities on the map.","Keep track of the roles you want and apply in a few clicks.","Follow your applications and turn opportunities into experience."][i]}</p></div>`).join("")}</div></div></section>
<section class="section" style="padding-top:25px"><div class="container"><div class="employer-cta"><div><h2>Are you an employer?</h2><p>Reach motivated students and young people by creating opportunities on CareerMap.</p></div><a class="btn" href="#/register?role=employer">Post an opportunity</a></div></div></section>
</main>`)}
function feature(icon,title,text){return `<div class="feature"><div class="icon">${icon}</div><h3>${title}</h3><p>${text}</p></div>`}
function login(){shell(`<main class="auth"><div class="auth-card"><h1>Welcome back</h1><p>Log in to continue to CareerMap.</p><div id="loginMsg"></div><form class="auth-form" onsubmit="event.preventDefault();doLogin()"><div class="field"><label class="label">Email</label><input class="input" id="loginEmail" type="email" required></div><div class="field"><label class="label">Password</label><input class="input" id="loginPass" type="password" required></div><button class="btn btn-primary">Log in</button></form><p style="text-align:center;margin-top:20px">Don't have an account? <a style="color:var(--blue-700);font-weight:750" href="#/register">Create an account</a></p></div></main>`)}
function doLogin(){const e=document.getElementById("loginEmail").value.trim().toLowerCase(),p=document.getElementById("loginPass").value;const u=state.users.find(x=>x.email===e&&x.password===p);if(!u){document.getElementById("loginMsg").innerHTML=`<div class="notice error">Email or password is incorrect.</div>`;return}state.currentUserId=u.id;persist();go(u.role==="employer"?"/employer/dashboard":"/dashboard")}
function register(){regRole=(new URLSearchParams(location.hash.split("?")[1]||"").get("role")==="employer"?"employer":"student");shell(`<main class="auth"><div class="auth-card"><h1>Create your account</h1><p>Join CareerMap as a student or employer.</p><div class="role-toggle"><button id="studentRole" class="active" onclick="setRegRole('student')">Student</button><button id="employerRole" onclick="setRegRole('employer')">Employer</button></div><div id="regForm"></div></div></main>`);setRegRole(regRole)}
let regRole="student";
function setRegRole(r){regRole=r;document.getElementById("studentRole")?.classList.toggle("active",r==="student");document.getElementById("employerRole")?.classList.toggle("active",r==="employer");document.getElementById("regForm").innerHTML=`<form class="auth-form" onsubmit="event.preventDefault();doRegister()">
<div class="field"><label class="label">${r==="student"?"Full name":"Contact name"}</label><input class="input" id="regName" required></div>
${r==="employer"?`<div class="field"><label class="label">Organisation name</label><input class="input" id="regOrg" required></div>`:""}
<div class="field"><label class="label">Email</label><input class="input" id="regEmail" type="email" required></div>
<div class="field"><label class="label">Password</label><input class="input" id="regPass" type="password" minlength="8" required><small class="muted">At least 8 characters.</small></div>
${r==="student"?`<div class="field"><label class="label">Subjects</label><input class="input" id="regSubjects" placeholder="e.g. Maths, Computer Science"></div><div class="field"><label class="label">Career interests</label><input class="input" id="regInterests" placeholder="e.g. Technology, Law"></div>`:`<div class="field"><label class="label">Organisation type</label><select class="select" id="regType"><option>Company</option><option>Charity</option><option>Public sector</option><option>School / College</option><option>University</option></select></div>`}
<div class="field"><label class="label">Location</label><input class="input" id="regLocation" placeholder="Town or city"></div>

function doRegister(){const name=document.getElementById("regName").value.trim(),email=document.getElementById("regEmail").value.trim().toLowerCase(),pass=document.getElementById("regPass").value;if(state.users.some(u=>u.email===email)){toast("An account with that email already exists.","error");return}const u={id:uid("u"),name,email,password:pass,role:regRole,location:document.getElementById("regLocation").value.trim(),subjects:regRole==="student"?document.getElementById("regSubjects").value:"",interests:regRole==="student"?document.getElementById("regInterests").value:"",organisation:regRole==="employer"?document.getElementById("regOrg").value.trim():"",orgType:regRole==="employer"?document.getElementById("regType").value:"",bio:""};state.users.push(u);state.currentUserId=u.id;state.notifications.push({id:uid("n"),userId:u.id,title:"Welcome to CareerMap",message:"Your account is ready. Complete your profile to get better recommendations.",read:false,date:new Date().toISOString()});persist();go(regRole==="employer"?"/employer/dashboard":"/dashboard")}
function logout(){state.currentUserId=null;persist();go("/");toast("You've been logged out.")}
function profile(){const u=user();if(!u)return go("/login");shell(`<main class="page"><div class="container"><div class="page-title"><div><h1>Your profile</h1><p>Keep your profile up to date so CareerMap can personalise your opportunities.</p></div></div><div class="card profile-card"><div class="profile-head"><div class="avatar">${initials(u.name)}</div><div><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">${esc(u.email)}</div></div></div><form class="form-grid" onsubmit="event.preventDefault();saveProfile()"><div class="field"><label class="label">Name</label><input class="input" id="pName" value="${esc(u.name)}" required></div><div class="field"><label class="label">Email</label><input class="input" value="${esc(u.email)}" disabled></div><div class="field"><label class="label">Subjects</label><input class="input" id="pSubjects" value="${esc(u.subjects||"")}"></div><div class="field"><label class="label">Career interests</label><input class="input" id="pInterests" value="${esc(u.interests||"")}"></div><div class="field"><label class="label">Location</label><input class="input" id="pLocation" value="${esc(u.location||"")}"></div><div class="field full"><label class="label">Bio</label><textarea class="textarea" id="pBio" rows="5">${esc(u.bio||"")}</textarea></div><div class="field full"><div id="profileMsg"></div><div class="form-actions"><button class="btn btn-primary">Save profile</button></div></div></form></div></div></main>`)}
function saveProfile(){const u=user();Object.assign(u,{name:document.getElementById("pName").value.trim(),subjects:document.getElementById("pSubjects").value,interests:document.getElementById("pInterests").value,location:document.getElementById("pLocation").value,bio:document.getElementById("pBio").value});persist();document.getElementById("profileMsg").innerHTML=`<div class="notice success">Profile saved successfully.</div>`;setTimeout(render,900)}
function opportunityScore(o,u){let score=0, txt=(o.title+" "+o.description+" "+o.skills.join(" ")).toLowerCase();(u?.subjects||"").split(",").forEach(x=>{if(x.trim()&&txt.includes(x.trim().toLowerCase()))score+=20});(u?.interests||"").split(",").forEach(x=>{if(x.trim()&&txt.includes(x.trim().toLowerCase()))score+=25});if(u?.location&&o.location.toLowerCase().includes(u.location.toLowerCase()))score+=30;return Math.min(99,Math.max(55,score+55))}
function isSaved(id){return !!user()&&state.saves.some(s=>s.userId===user().id&&s.opportunityId===id)}
function toggleSave(id){const u=user();if(!u){go("/login");return}const i=state.saves.findIndex(s=>s.userId===u.id&&s.opportunityId===id);if(i>=0){state.saves.splice(i,1);toast("Opportunity removed from saved.","")}else{state.saves.push({id:uid("s"),userId:u.id,opportunityId:id,date:new Date().toISOString()});toast("Opportunity saved successfully.","success")}persist();render()}
function oppCard(o,compact=false){const saved=isSaved(o.id);return `<article class="card opp-card"><div class="opp-top"><div><div class="org">${esc(o.organisation)}</div><div class="opp-title">${esc(o.title)}</div></div><button class="save ${saved?"saved":""}" onclick="toggleSave('${o.id}')" aria-label="Save opportunity">${saved?"♥ Saved":"♡ Save"}</button></div><div class="meta"><span>⌖ ${esc(o.location)}</span><span>• ${esc(o.type)}</span><span>• ${esc(o.duration)}</span></div><p class="desc">${esc(o.description)}</p><div class="skills">${o.skills.slice(0,compact?2:4).map(s=>`<span class="skill">${esc(s)}</span>`).join("")}</div><div class="card-actions"><a class="btn btn-primary btn-small" href="#/opportunities/${o.id}">View details</a></div></article>`}
function opportunities(){shell(`<main class="page"><div class="container"><div class="page-title"><div><h1>Explore opportunities</h1><p>Find experience that matches your interests and ambitions.</p></div><button class="btn btn-secondary" onclick="locateUser()">⌖ Use my location</button></div><div class="toolbar"><input id="q" class="input search" placeholder="Search title, organisation, location, skills..." oninput="filterOpps()"><select id="type" class="select" style="width:180px" onchange="filterOpps()"><option value="">All types</option>${["Work Experience","Internship","Apprenticeship","Insight Day","Shadowing","Volunteering","Placement","Event"].map(x=>`<option>${x}</option>`).join("")}</select><select id="duration" class="select" style="width:170px" onchange="filterOpps()"><option value="">Any duration</option><option>1 day</option><option>2–3 days</option><option>1 week</option><option>2+ weeks</option><option>Flexible</option></select><select id="sort" class="select" style="width:170px" onchange="filterOpps()"><option value="new">Newest</option><option value="title">Title A–Z</option><option value="org">Organisation A–Z</option><option value="near">Nearest first</option></select></div><div class="count" id="oppCount"></div><div class="layout-map"><div class="listbox" id="oppList"></div><div class="mapbox" id="map"></div></div></div></main>`);filterOpps()}
let leafletMap=null;
function getDistance(a,b,c,d){const R=3958.8,rad=x=>x*Math.PI/180, x=rad(c-a),y=rad(d-b),h=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function filterOpps(){const q=(document.getElementById("q")?.value||"").toLowerCase(),type=document.getElementById("type")?.value||"",dur=document.getElementById("duration")?.value||"",sort=document.getElementById("sort")?.value||"new";let arr=state.opportunities.filter(o=>o.status==="Published"&&(!q||(o.title+" "+o.organisation+" "+o.location+" "+o.description+" "+o.skills.join(" ")+" "+o.type).toLowerCase().includes(q))&&(!type||o.type===type)&&(!dur||o.duration===dur));const loc=window.userCoords;if(sort==="title")arr.sort((a,b)=>a.title.localeCompare(b.title));if(sort==="org")arr.sort((a,b)=>a.organisation.localeCompare(b.organisation));if(sort==="new")arr.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(sort==="near"&&loc)arr.sort((a,b)=>getDistance(loc.lat,loc.lng,a.lat,a.lng)-getDistance(loc.lat,loc.lng,b.lat,b.lng));document.getElementById("oppCount").textContent=`${arr.length} opportunit${arr.length===1?"y":"ies"} found`;document.getElementById("oppList").innerHTML=arr.length?arr.map(o=>oppCard(o,true)).join(""):`<div class="empty">No opportunities match your search.<br><button class="btn btn-secondary btn-small" style="margin-top:12px" onclick="clearFilters()">Clear filters</button></div>`;drawMap(arr)}
function clearFilters(){["q","type","duration"].forEach(id=>{const x=document.getElementById(id);if(x)x.value=""});document.getElementById("sort").value="new";filterOpps()}
function locateUser(){if(!navigator.geolocation){toast("Location isn't available in this browser.","error");return}toast("Requesting your location…");navigator.geolocation.getCurrentPosition(p=>{window.userCoords={lat:p.coords.latitude,lng:p.coords.longitude};toast("Location enabled. Nearest sorting is now available.","success");document.getElementById("sort").value="near";filterOpps()},()=>toast("We couldn't access your location. You can still browse normally.","error"),{enableHighAccuracy:true,timeout:8000})}
function drawMap(arr){const mapEl=document.getElementById("map");if(!mapEl)return;if(!window.L){mapEl.innerHTML=`<div style="height:100%;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted);background:linear-gradient(145deg,#e7f2ff,#f7fbff)"><div><div style="font-size:38px;color:var(--blue-700);margin-bottom:10px">⌖</div><strong style="color:var(--blue-900)">Interactive map unavailable</strong><p style="max-width:300px;line-height:1.5">The opportunity list is fully usable. Connect to the internet and reload to enable the live map.</p></div></div>`;return;}if(leafletMap)leafletMap.remove();leafletMap=L.map("map").setView([52.2,-1.5],7);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(leafletMap);const bounds=[];arr.forEach(o=>{const m=L.marker([o.lat,o.lng]).addTo(leafletMap).bindPopup(`<strong>${esc(o.title)}</strong><br>${esc(o.organisation)}<br>${esc(o.location)}<br><a href="#/opportunities/${o.id}">View details →</a>`);bounds.push([o.lat,o.lng])});if(window.userCoords){L.circleMarker([userCoords.lat,userCoords.lng],{radius:8,color:"#1265c4",fillOpacity:.8}).addTo(leafletMap).bindPopup("Your location");bounds.push([userCoords.lat,userCoords.lng])}if(bounds.length)leafletMap.fitBounds(bounds,{padding:[30,30]})}
function details(id){const o=state.opportunities.find(x=>x.id===id);if(!o)return go("/opportunities");const u=user();const own=u?.role==="employer"&&o.employerId===u.id;const applied=u&&state.applications.some(a=>a.studentId===u.id&&a.opportunityId===id);shell(`<main class="page"><div class="container"><a href="#/opportunities" class="muted">← Back to opportunities</a><div class="detail-grid" style="margin-top:16px"><div class="detail"><div class="org">${esc(o.organisation)}</div><h1>${esc(o.title)}</h1><div class="meta"><span>⌖ ${esc(o.location)}</span><span>• ${esc(o.type)}</span><span>• ${esc(o.duration)}</span><span>• ${esc(o.remote)}</span></div><hr style="border:0;border-top:1px solid var(--border);margin:24px 0"><h2>About this opportunity</h2><p class="muted" style="line-height:1.75">${esc(o.description)}</p><h2 style="margin-top:28px">Skills</h2><div class="skills">${o.skills.map(s=>`<span class="skill">${esc(s)}</span>`).join("")}</div><h2 style="margin-top:28px">Who can apply?</h2><p class="muted">${esc(o.access)}</p><h2 style="margin-top:28px">Key information</h2><div class="grid" style="grid-template-columns:1fr 1fr"><div><b>Deadline</b><p class="muted">${formatDate(o.deadline)}</p></div><div><b>Spaces</b><p class="muted">${o.spaces}</p></div><div><b>Payment</b><p class="muted">${esc(o.paid)}</p></div><div><b>Format</b><p class="muted">${esc(o.remote)}</p></div></div></div><aside class="card side"><div class="org">${esc(o.organisation)}</div><h2 style="font-size:22px">${deadlineText(o.deadline)}</h2>${u?.role==="student"?`${applied?`<button class="btn btn-secondary" disabled>✓ Application submitted</button>`:`<button class="btn btn-primary" onclick="openApply('${o.id}')">Apply now</button>`}<button class="btn btn-ghost" onclick="toggleSave('${o.id}')">${isSaved(o.id)?"♥ Saved":"♡ Save opportunity"}</button>`:own?`<a class="btn btn-primary" href="#/employer/opportunities/${o.id}/edit">Edit opportunity</a><button class="btn btn-danger" onclick="deleteOpp('${o.id}')">Delete opportunity</button>`:`<a class="btn btn-primary" href="#/register">Create an account</a>`}<div style="margin-top:20px;padding-top:17px;border-top:1px solid var(--border)" class="muted">Published by <strong>${esc(o.organisation)}</strong></div></aside></div></div></main>`)}
function formatDate(x){return x?new Date(x+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"No deadline"}
function deadlineText(d){if(!d)return"No deadline";let n=Math.ceil((new Date(d+"T23:59:59")-new Date())/86400000);return n<0?"Applications closed":n===0?"Closes today":n===1?"Closes tomorrow":`Applications close in ${n} days`}
function openApply(id){const o=state.opportunities.find(x=>x.id===id),u=user();document.body.insertAdjacentHTML("beforeend",`<div class="modal-wrap" id="applyModal"><div class="modal"><div class="modal-head"><h2>Apply for ${esc(o.title)}</h2><button class="close" onclick="document.getElementById('applyModal').remove()">×</button></div><p class="muted">${esc(o.organisation)} · ${esc(o.location)}</p><form class="auth-form" onsubmit="event.preventDefault();submitApply('${o.id}')"><div class="field"><label class="label">Name</label><input class="input" value="${esc(u.name)}" disabled></div><div class="field"><label class="label">Email</label><input class="input" value="${esc(u.email)}" disabled></div><div class="field"><label class="label">Cover message</label><textarea class="textarea" id="cover" rows="6" required placeholder="Tell the organisation why you're interested…"></textarea></div><div class="field"><label class="label">CV</label><input class="input" id="cv" type="file" accept=".pdf,.doc,.docx"></div><button class="btn btn-primary">Submit application</button></form></div></div>`)}
function submitApply(id){const u=user(),o=state.opportunities.find(x=>x.id===id);if(new Date(o.deadline+"T23:59:59")<new Date()){toast("This application deadline has passed.","error");return}if(state.applications.some(a=>a.studentId===u.id&&a.opportunityId===id)){toast("You've already applied.","error");return}state.applications.push({id:uid("a"),studentId:u.id,opportunityId:id,cover:document.getElementById("cover").value,cv:document.getElementById("cv").files[0]?.name||"",status:"Applied",createdAt:new Date().toISOString()});state.notifications.push({id:uid("n"),userId:u.id,title:"Application submitted",message:`Your application for ${o.title} has been submitted.`,read:false,date:new Date().toISOString()});persist();document.getElementById("applyModal").remove();toast("Application submitted successfully.","success");details(id)}
function dashboard(){const u=user();if(!u)return go("/login");if(u.role!=="student")return go("/employer/dashboard");const apps=state.applications.filter(a=>a.studentId===u.id),saves=state.saves.filter(s=>s.userId===u.id),unread=state.notifications.filter(n=>n.userId===u.id&&!n.read).length;const rec=[...state.opportunities].filter(o=>o.status==="Published").sort((a,b)=>opportunityScore(b,u)-opportunityScore(a,u)).slice(0,3);shell(`<main class="page"><div class="container"><div class="page-title"><div><h1>Welcome, ${esc(u.name.split(" ")[0])} 👋</h1><p>Here's your CareerMap at a glance.</p></div><a class="btn btn-primary" href="#/opportunities">Find opportunities</a></div><div class="dashboard-grid">${stat("Saved opportunities",saves.length)}${stat("Applications",apps.length)}${stat("Awaiting response",apps.filter(a=>["Applied","Under Review","Shortlisted"].includes(a.status)).length)}${stat("Notifications",unread)}</div><div class="dash-layout"><section class="card panel"><h2>Recommended for you</h2><div class="grid">${rec.map(o=>`<div>${oppCard(o,true)}<div style="margin-top:-8px;text-align:right;font-size:12px;color:var(--blue-700);font-weight:800">${opportunityScore(o,u)}% match</div></div>`).join("")}</div></section><aside class="card panel"><h2>Quick actions</h2><div style="display:grid;gap:9px"><a class="btn btn-secondary" href="#/saved">♡ Saved opportunities</a><a class="btn btn-secondary" href="#/applications">▣ My applications</a><a class="btn btn-secondary" href="#/profile">✎ Edit profile</a><button class="btn btn-ghost" onclick="markNotificationsRead()">✓ Mark notifications read</button></div></aside></div><section class="card panel" style="margin-top:17px"><h2>Recent applications</h2>${apps.length?`<table class="table"><thead><tr><th>Opportunity</th><th>Organisation</th><th>Applied</th><th>Status</th></tr></thead><tbody>${apps.slice(-5).reverse().map(a=>{const o=state.opportunities.find(x=>x.id===a.opportunityId);return `<tr><td><a href="#/opportunities/${o?.id}" style="font-weight:750;color:var(--blue-800)">${esc(o?.title||"Removed opportunity")}</a></td><td>${esc(o?.organisation||"—")}</td><td>${formatDate(a.createdAt.slice(0,10))}</td><td>${status(a.status)}</td></tr>`}).join("")}</tbody></table>`:`<div class="empty">You haven't applied to anything yet.<br><a class="btn btn-secondary btn-small" style="margin-top:12px" href="#/opportunities">Explore opportunities</a></div>`}</section></div></main>`)}
function stat(l,v){return `<div class="card stat"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`}
function status(s){return `<span class="status ${s==="Accepted"?"accepted":s==="Rejected"?"rejected":s==="Under Review"||s==="Shortlisted"?"review":""}">${esc(s)}</span>`}
function saved(){const u=user();if(!u)return go("/login");const arr=state.saves.filter(s=>s.userId===u.id).map(s=>state.opportunities.find(o=>o.id===s.opportunityId)).filter(Boolean);shell(`<main class="page"><div class="container"><div class="page-title"><div><h1>Saved opportunities</h1><p>Keep track of the opportunities you don't want to lose.</p></div></div><div class="grid">${arr.length?arr.map(o=>oppCard(o)).join(""):`<div class="empty card">Your saved opportunities will appear here.<br><a class="btn btn-primary btn-small" style="margin-top:12px" href="#/opportunities">Explore opportunities</a></div>`}</div></div></main>`)}
function applications(){const u=user();if(!u)return go("/login");const arr=state.applications.filter(a=>a.studentId===u.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));shell(`<main class="page"><div class="container"><div class="page-title"><div><h1>My applications</h1><p>Track every application from submission to outcome.</p></div></div><div class="card panel">${arr.length?`<table class="table"><thead><tr><th>Opportunity</th><th>Organisation</th><th>Applied</th><th>Status</th><th></th></tr></thead><tbody>${arr.map(a=>{const o=state.opportunities.find(x=>x.id===a.opportunityId);return `<tr><td><a href="#/opportunities/${o?.id}" style="font-weight:750;color:var(--blue-800)">${esc(o?.title||"Removed")}</a></td><td>${esc(o?.organisation||"—")}</td><td>${formatDate(a.createdAt.slice(0,10))}</td><td>${status(a.status)}</td><td>${["Applied","Under Review","Shortlisted"].includes(a.status)?`<button class="btn btn-danger btn-small" onclick="withdraw('${a.id}')">Withdraw</button>`:""}</td></tr>`}).join("")}</tbody></table>`:`<div class="empty">You haven't submitted any applications yet.</div>`}</div></div></main>`)}
function withdraw(id){const a=state.applications.find(x=>x.id===id);if(!a)return;if(confirm("Withdraw this application?")){a.status="Withdrawn";persist();toast("Application withdrawn.");render()}}
function notifications(){const u=user();if(!u)return go("/login");const arr=state.notifications.filter(n=>n.userId===u.id).sort((a,b)=>b.date.localeCompare(a.date));shell(`<main class="page"><div class="container"><div class="page-title"><div><h1>Notifications</h1><p>Stay up to date with your CareerMap activity.</p></div><button class="btn btn-secondary" onclick="markNotificationsRead()">Mark all as read</button></div><div class="card panel">${arr.length?arr.map(n=>`<div class="notification ${n.read?"":"unread"}"><strong>${esc(n.title)}</strong><div class="muted" style="margin-top:4px">${esc(n.message)}</div><small class="muted">${new Date(n.date).toLocaleString("en-GB")}</small></div>`).join(""):`<div class="empty">You're all caught up.</div>`}</div></div></main>`)}
function markNotificationsRead(){const u=user();state.notifications.filter(n=>n.userId===u?.id).forEach(n=>n.read=true);persist();toast("Notifications marked as read.","success");render()}
function employerDash(){const u=user();if(!u)return go("/login");if(u.role!=="employer")return go("/dashboard");const mine=state.opportunities.filter(o=>o.employerId===u.id),apps=state.applications.filter(a=>mine.some(o=>o.id===a.opportunityId));shell(`<main class="page"><div class="container"><div class="page-title"><div><h1>Welcome, ${esc(u.name.split(" ")[0])}</h1><p>Manage your opportunities and applications.</p></div><a class="btn btn-primary" href="#/employer/opportunities/new">+ Create opportunity</a></div><div class="dashboard-grid">${stat("Total opportunities",mine.length)}${stat("Active opportunities",mine.filter(o=>o.status==="Published").length)}${stat("Total applications",apps.length)}${stat("Awaiting review",apps.filter(a=>["Applied","Under Review"].includes(a.status)).length)}</div><section class="card panel"><h2>Your opportunities</h2>${mine.length?`<table class="table"><thead><tr><th>Opportunity</th><th>Location</th><th>Applicants</th><th>Status</th><th>Actions</th></tr></thead><tbody>${mine.map(o=>{const n=apps.filter(a=>a.opportunityId===o.id).length;return `<tr><td><a href="#/opportunities/${o.id}" style="font-weight:750;color:var(--blue-800)">${esc(o.title)}</a></td><td>${esc(o.location)}</td><td>${n}</td><td>${status(o.status)}</td><td><a class="btn btn-ghost btn-small" href="#/employer/opportunities/${o.id}/edit">Edit</a> <button class="btn btn-danger btn-small" onclick="deleteOpp('${o.id}')">Delete</button></td></tr>`}).join("")}</tbody></table>`:`<div class="empty">You haven't created an opportunity yet.<br><a class="btn btn-primary btn-small" style="margin-top:12px" href="#/employer/opportunities/new">Create your first opportunity</a></div>`}</section><section class="card panel" style="margin-top:17px"><h2>Recent applications</h2>${apps.length?`<table class="table"><thead><tr><th>Student</th><th>Opportunity</th><th>Applied</th><th>Status</th><th>Change</th></tr></thead><tbody>${apps.slice(-10).reverse().map(a=>{const o=state.opportunities.find(x=>x.id===a.opportunityId),s=state.users.find(x=>x.id===a.studentId);return `<tr><td>${esc(s?.name||"Student")}<br><small class="muted">${esc(s?.email||"")}</small></td><td>${esc(o?.title||"Removed")}</td><td>${formatDate(a.createdAt.slice(0,10))}</td><td>${status(a.status)}</td><td><select class="select" onchange="changeStatus('${a.id}',this.value)" style="width:150px"><option>${esc(a.status)}</option>${["Under Review","Shortlisted","Accepted","Rejected"].filter(x=>x!==a.status).map(x=>`<option>${x}</option>`).join("")}</select></td></tr>`}).join("")}</tbody></table>`:`<div class="empty">Applications will appear here when students apply.</div>`}</section></div></main>`)}
function changeStatus(id,s){const a=state.applications.find(x=>x.id===id);if(!a)return;a.status=s;state.notifications.push({id:uid("n"),userId:a.studentId,title:"Application status updated",message:`Your application status has changed to ${s}.`,read:false,date:new Date().toISOString()});persist();toast("Application status updated.","success");render()}
function employerProfile(){const u=user();if(!u)return go("/login");if(u.role!=="employer")return go("/dashboard");shell(`<main class="page"><div class="container"><div class="page-title"><div><h1>Organisation profile</h1><p>Tell students what your organisation does.</p></div></div><div class="card profile-card"><form class="form-grid" onsubmit="event.preventDefault();saveEmployerProfile()"><div class="field"><label class="label">Organisation name</label><input class="input" id="epOrg" value="${esc(u.organisation||"")}" required></div><div class="field"><label class="label">Industry</label><input class="input" id="epIndustry" value="${esc(u.industry||"")}"></div><div class="field"><label class="label">Website</label><input class="input" id="epWebsite" value="${esc(u.website||"")}" placeholder="https://"></div><div class="field"><label class="label">Location</label><input class="input" id="epLocation" value="${esc(u.location||"")}"></div><div class="field"><label class="label">Contact email</label><input class="input" value="${esc(u.email)}" disabled></div><div class="field"><label class="label">Organisation type</label><input class="input" value="${esc(u.orgType||"")}" disabled></div><div class="field full"><label class="label">Description</label><textarea class="textarea" id="epDesc" rows="6">${esc(u.bio||"")}</textarea></div><div class="field full"><div class="form-actions"><button class="btn btn-primary">Save organisation profile</button></div></div></form></div></div></main>`)}
function saveEmployerProfile(){const u=user();Object.assign(u,{organisation:document.getElementById("epOrg").value,industry:document.getElementById("epIndustry").value,website:document.getElementById("epWebsite").value,location:document.getElementById("epLocation").value,bio:document.getElementById("epDesc").value});persist();toast("Organisation profile saved.","success");render()}
function oppForm(editId=null){const u=user();if(!u||u.role!=="employer")return go("/employer/dashboard");const o=editId?state.opportunities.find(x=>x.id===editId):null;if(editId&&(!o||o.employerId!==u.id))return go("/employer/dashboard");shell(`<main class="page"><div class="container"><div class="page-title"><div><h1>${o?"Edit opportunity":"Create an opportunity"}</h1><p>${o?"Update your listing details.":"Share a new opportunity with students and young people."}</p></div></div><div class="card profile-card"><form class="form-grid" onsubmit="event.preventDefault();saveOpp('${editId||""}')"><div class="field full"><label class="label">Title *</label><input class="input" id="oTitle" value="${esc(o?.title||"")}" required></div><div class="field"><label class="label">Organisation *</label><input class="input" id="oOrg" value="${esc(o?.organisation||u.organisation||"")}" required></div><div class="field"><label class="label">Location *</label><input class="input" id="oLocation" value="${esc(o?.location||u.location||"")}" required></div><div class="field"><label class="label">Type *</label><select class="select" id="oType" required>${["Work Experience","Internship","Apprenticeship","Insight Day","Shadowing","Volunteering","Placement","Event"].map(x=>`<option ${o?.type===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label class="label">Duration *</label><select class="select" id="oDuration" required>${["1 day","2–3 days","1 week","2+ weeks","Flexible"].map(x=>`<option ${o?.duration===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label class="label">Deadline *</label><input class="input" id="oDeadline" type="date" value="${esc(o?.deadline||"")}" required></div><div class="field"><label class="label">Spaces</label><input class="input" id="oSpaces" type="number" min="1" value="${esc(o?.spaces||10)}"></div><div class="field"><label class="label">Format</label><select class="select" id="oRemote"><option ${o?.remote==="In-person"?"selected":""}>In-person</option><option ${o?.remote==="Hybrid"?"selected":""}>Hybrid</option><option ${o?.remote==="Remote"?"selected":""}>Remote</option></select></div><div class="field"><label class="label">Paid / unpaid</label><select class="select" id="oPaid"><option ${o?.paid==="Paid"?"selected":""}>Paid</option><option ${o?.paid!=="Paid"?"selected":""}>Unpaid</option></select></div><div class="field"><label class="label">Access</label><input class="input" id="oAccess" value="${esc(o?.access||"Open to all students")}"></div><div class="field full"><label class="label">Description *</label><textarea class="textarea" id="oDesc" rows="7" required>${esc(o?.description||"")}</textarea></div><div class="field full"><label class="label">Skills (comma separated)</label><input class="input" id="oSkills" value="${esc(o?.skills?.join(", ")||"")}"></div><div class="field"><label class="label">Latitude</label><input class="input" id="oLat" type="number" step="any" value="${esc(o?.lat||"51.5074")}"></div><div class="field"><label class="label">Longitude</label><input class="input" id="oLng" type="number" step="any" value="${esc(o?.lng||"-0.1278")}"></div><div class="field full"><div class="form-actions"><a class="btn btn-ghost" href="#/employer/dashboard">Cancel</a><button class="btn btn-primary">${o?"Save changes":"Publish opportunity"}</button></div></div></form></div></div></main>`)}
function saveOpp(editId){const u=user();const data={title:document.getElementById("oTitle").value.trim(),organisation:document.getElementById("oOrg").value.trim(),location:document.getElementById("oLocation").value.trim(),type:document.getElementById("oType").value,duration:document.getElementById("oDuration").value,deadline:document.getElementById("oDeadline").value,spaces:+document.getElementById("oSpaces").value||1,remote:document.getElementById("oRemote").value,paid:document.getElementById("oPaid").value,access:document.getElementById("oAccess").value,description:document.getElementById("oDesc").value.trim(),skills:document.getElementById("oSkills").value.split(",").map(x=>x.trim()).filter(Boolean),lat:+document.getElementById("oLat").value||51.5074,lng:+document.getElementById("oLng").value||-0.1278};if(editId){const o=state.opportunities.find(x=>x.id===editId);Object.assign(o,data);toast("Opportunity updated successfully.","success")}else{state.opportunities.push({...data,id:uid("o"),employerId:u.id,status:"Published",createdAt:new Date().toISOString().slice(0,10)});toast("Opportunity created successfully.","success")}persist();go("/employer/dashboard")}
function deleteOpp(id){const u=user(),o=state.opportunities.find(x=>x.id===id);if(!o||!u||o.employerId!==u.id){toast("You don't have permission to delete this opportunity.","error");return}if(confirm("Are you sure you want to delete this opportunity?")){state.opportunities=state.opportunities.filter(x=>x.id!==id);state.saves=state.saves.filter(s=>s.opportunityId!==id);persist();toast("Opportunity deleted successfully.","success");go("/employer/dashboard")}}
function routeRender(){const m=route.match(/^\/opportunities\/([^/]+)$/);const e=route.match(/^\/employer\/opportunities\/([^/]+)\/edit$/);if(route==="/")return home();if(route==="/login")return login();if(route==="/register")return register();if(route==="/opportunities")return opportunities();if(m)return details(m[1]);if(route==="/dashboard")return dashboard();if(route==="/profile")return profile();if(route==="/saved")return saved();if(route==="/applications")return applications();if(route==="/notifications")return notifications();if(route==="/employer/dashboard")return employerDash();if(route==="/employer/profile")return employerProfile();if(route==="/employer/opportunities/new")return oppForm();if(e)return oppForm(e[1]);return home()}
function render(){window.scrollTo(0,0);try{routeRender()}catch(err){console.error(err);shell(`<main class="page"><div class="container"><div class="card panel"><h2>Something went wrong</h2><p class="muted">CareerMap couldn't load this page. Please try again.</p><button class="btn btn-primary" onclick="go('/')">Return home</button></div></div></main>`)}}
render();
</script>
</body>
</html>
